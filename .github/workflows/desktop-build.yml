name: desktop-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop

  package:
    name: Package ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: pack:win
            arch: x64
            artifact: windows-x64
          - name: macOS Apple silicon
            os: macos-15
            script: pack:mac
            arch: arm64
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            script: pack:mac
            arch: x64
            artifact: macos-x64
          - name: Linux x64
            os: ubuntu-latest
            script: pack:linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Run native checks
        run: npm run check
        working-directory: desktop
      - name: Install Linux GUI and packaging dependencies
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y fakeroot
      - name: Build native packages
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
      - name: Test packaged desktop on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run test:toolbox:packaged
      - name: Test packaged desktop on Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a npm run test:toolbox:packaged
      - name: Upload tested installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/ColdCoffee-Workbench-*.exe
            desktop/dist/ColdCoffee-Workbench-*.dmg
            desktop/dist/ColdCoffee-Workbench-*.zip
            desktop/dist/ColdCoffee-Workbench-*.AppImage
            desktop/dist/ColdCoffee-Workbench-*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete cross-platform release
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Validate complete installer set
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p out
          for name in \
            "ColdCoffee-Workbench-Windows-${version}-x64.exe" \
            "ColdCoffee-Workbench-macOS-arm64-${version}.dmg" \
            "ColdCoffee-Workbench-macOS-arm64-${version}.zip" \
            "ColdCoffee-Workbench-macOS-x64-${version}.dmg" \
            "ColdCoffee-Workbench-macOS-x64-${version}.zip" \
            "ColdCoffee-Workbench-Linux-x86_64-${version}.AppImage" \
            "ColdCoffee-Workbench-Linux-amd64-${version}.deb"; do
            test -s "release-assets/$name"
            cp "release-assets/$name" out/
          done
          cp desktop/src/lib/toolbox/SKILL.md out/coldcoffee-toolbox-SKILL.md
          cp docs/original-toolbox.md out/Original-Toolbox.md
          cp "docs/release-notes-${version}.md" out/RELEASE_NOTES.md
          (cd out && sha256sum ColdCoffee-Workbench-* coldcoffee-toolbox-SKILL.md Original-Toolbox.md RELEASE_NOTES.md > SHA256SUMS.txt)
      - name: Publish release after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          shopt -s nullglob
          files=(out/*)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "冷咖啡工作台 $version" --draft --prerelease --notes-file out/RELEASE_NOTES.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
