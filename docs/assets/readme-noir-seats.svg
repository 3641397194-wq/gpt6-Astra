<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
  <title id="title">ColdBrew Zero model poster</title>
  <desc id="desc">An original black and red manga-poster display of the six model seats.</desc>
  <rect width="1600" height="390" fill="#0a0909"/>
  <path d="M0 0h1600v390H0z" fill="#f3ebe1" opacity=".035"/>
  <g stroke="#72514d" stroke-width="1">
