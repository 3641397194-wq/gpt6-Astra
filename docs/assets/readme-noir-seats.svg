    <text x="820" y="138" fill="#f3ebe1" font-size="26" font-weight="700">DEEPSEEK</text>
    <text x="820" y="168" fill="#b8aaa0" font-size="12" letter-spacing="2">V4.1 / 04</text>
    <text x="1080" y="138" fill="#e3353d" font-size="26" font-weight="700">GLM 5.3</text>
    <text x="1080" y="168" fill="#f1b3b5" font-size="12" letter-spacing="2">CHA / 05</text>
    <text x="1340" y="138" fill="#e3353d" font-size="26" font-weight="700">GEMINI</text>
    <text x="1340" y="168" fill="#f1b3b5" font-size="12" letter-spacing="2">BREAK / 06</text>
